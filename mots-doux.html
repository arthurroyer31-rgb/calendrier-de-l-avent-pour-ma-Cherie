<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attaque de Bienveillance 💌</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d131f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 24px 16px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(212, 163, 89, 0.2);
            color: #ffdf9e;
            border: 1px solid #d4a359;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            color: #fff5e4;
            font-size: 1.55rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #ead7c3;
            font-size: 0.92rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Carte du compliment */
        .note-card {
            background: linear-gradient(160deg, #331c0d, #1f1006);
            border: 2px solid #d4a359;
            border-radius: 22px;
            padding: 36px 24px;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 163, 89, 0.18);
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .note-card.flip {
            transform: scale(0.95);
            opacity: 0.4;
        }

        .note-icon {
            font-size: 2rem;
            margin-bottom: 14px;
        }

        .note-text {
            color: #fff5e4;
            font-size: 1.15rem;
            line-height: 1.65;
            font-style: italic;
        }

        .counter {
            font-size: 0.82rem;
            color: #d4a359;
            margin-bottom: 16px;
        }

        .btn-gold {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #d4a359, #a67228);
            color: #1a0e05;
            font-weight: bold;
            font-size: 1.02rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
            margin-bottom: 16px;
        }
        .btn-gold:hover { transform: scale(1.02); }
        .btn-gold:active { transform: scale(0.98); }

        .btn-back {
            display: inline-block;
            color: #d6c3b0;
            font-size: 0.9rem;
            text-decoration: none;
            border-bottom: 1px solid rgba(214, 195, 176, 0.4);
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">💌 23 Décembre — Dose de bonheur</span>
        <h1>Rien que pour vous Ma Dame</h1>
        <p class="subtitle">À consommer sans modération dès que vous avez besoin d'un sourire ✨</p>

        <div class="note-card" id="noteCard">
            <div class="note-icon" id="noteIcon">✨</div>
            <p class="note-text" id="noteText">Appuyez sur le bouton ci-dessous pour piocher votre premier mot doux...</p>
        </div>

        <div class="counter" id="counterText">0 / 15 découverts</div>

        <button class="btn-gold" onclick="piocherMotDoux()">Piocher un petit mot 💌</button>
        <br>
        <a href="index.html" class="btn-back">← Retourner à l'immeuble</a>
    </div>

    <script>
        // ==========================================
        // TA LISTE DE COMPLIMENTS & MOTS DOUX
        // (Tu peux en ajouter ou modifier autant que tu veux !)
        // ==========================================
        const MOTS_DOUX = [
            { icon: "✨", texte: "Vous êtes de loin la plus belle rencontre que j'ai faite." },
            { icon: "🏛️", texte: "J'adore la façon dont votre regard d'architecte remarque les petits détails que personne d'autre ne voit." },
            { icon: "😊", texte: "Votre sourire suffit à rattraper n'importe quelle journée compliquée." },
            { icon: "🔥", texte: "Vous êtes sublime, même quand vous pensez ne pas être apprêtée." },
            { icon: "☕", texte: "Chaque moment passé avec vous, même autour d'une simple tisane, est mon moment préféré de la journée." },
            { icon: "💪", texte: "N'oubliez jamais tout ce que vous êtes capable d'accomplir : je suis tellement fier de vous." },
            { icon: "❤️", texte: "Depuis le 18 novembre, j'ai l'impression d'avoir tiré le gros lot." },
            { icon: "🌙", texte: "J'aime votre douceur, votre humour et la manière dont vous prenez soin des gens autour de vous." },
            { icon: "🧶", texte: "Le pull en laine bleue vous va décidément beaucoup mieux qu'à moi." },
            { icon: "🌟", texte: "Vous avez une élégance naturelle qui ne laisse personne indifférent." },
            { icon: "🥂", texte: "Hâte de vivre encore des dizaines d'aventures, de restos et de fous rires à vos côtés." },
            { icon: "👑", texte: "Rappel officiel : vous êtes une femme incroyable, ne laissez jamais le doute vous faire croire le contraire." }
        ];

        let restants = [...MOTS_DOUX];
        let vus = 0;

        document.getElementById('counterText').innerText = `0 / ${MOTS_DOUX.length} découverts`;

        function piocherMotDoux() {
            const card = document.getElementById('noteCard');
            card.classList.add('flip');

            setTimeout(() => {
                if (restants.length === 0) {
                    restants = [...MOTS_DOUX];
                }

                const indexAleatoire = Math.floor(Math.random() * restants.length);
                const choisi = restants.splice(indexAleatoire, 1)[0];

                if (vus < MOTS_DOUX.length) {
                    vus++;
                }

                document.getElementById('noteIcon').innerText = choisi.icon;
                document.getElementById('noteText').innerText = `« ${choisi.texte} »`;
                document.getElementById('counterText').innerText = `${vus} / ${MOTS_DOUX.length} découverts`;

                card.classList.remove('flip');
            }, 220);
        }
    </script>
</body>
</html>
